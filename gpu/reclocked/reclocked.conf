# /etc/reclocked.conf — configuration of the reclocked daemon v5.15 ([dgpu-active] policy + fan + [fan-case] + switchd + dGPU-dead gate)
# Copy: sudo cp reclocked.conf /etc/reclocked.conf
#
# List of "preferred" application classes (hyprctl activewindow/clients .class).
# Preferred = an app from this list that is FOCUSED OR (RUNNING + busy > busy-up) OR
# (focused.title contains a pattern from [preferred-titles]).
# Here: browsers (broad scope — any of them focused under load → 0e,
# idle DOWNshifts). Discord/YouTube are tabs in a browser — detected
# by title in [preferred-titles], not by class (they have no window class of their own).
# When [dgpu-active] enable=true: the profiles provide ONLY the thermal thresholds
# (max-pstate ignored) — the pstate is chosen by the [dgpu-active] state machine.

[preferred]
chromium
firefox
google-chrome
brave

# v4.1: "preferred" window titles (substring, case-insensitive). Discord/YouTube
# are tabs in a browser (window class = the browser) — the content is visible in the title.
# Discord web: the title contains "Discord". YouTube: "YouTube" / " - YouTube".
# v4.4: applies ONLY to browser tabs (class chromium/firefox etc.) —
# the desktop Discord (Electron or Chrome PWA) is handled by [caps].
# v5.6: with [dgpu-active] the title is INFORMATIONAL (status/log "video: ...") —
# it does NOT force 0e. 0e enters only via busy > busy-enter (80%) + temp.
[preferred-titles]
Discord
YouTube
 - YouTube

# v5.6: player classes qualifying "video" INFORMATIONALY (status/log) when the
# title does not contain a known service (mpv/vlc have the file path in the title).
# A video title/class does NOT decide the pstate (0e = exclusively busy-driven).
[video-classes]
# mpv
# vlc

# v4.4: per-class policy. Key = window class; value = floor=…, max=…, busy-up=…
#   floor    — resting state (IDLE does not drop below), hex pstate (e.g. 0a)
#   max      — ceiling (never higher than this), hex pstate (e.g. 0e)
#   busy-up  — own UP-LOAD threshold (%), instead of the global busy-up (80)
# A class with an entry = preferred (when focused) and does NOT catch title-priority.
# v5.6: desktop Discord was REMOVED (user decision 2026-08-28) — Discord is
# treated like any other class on the dGPU: it gets the full eco from [dgpu-active]
# (0a baseline / 07 deep idle / 0e only at real busy > 80%).
# The section stays for classes that want a HARD floor (e.g. floor=0a = never 07).
# THERMAL is still paramount (it may drop below the floor). A Discord tab in a browser
# (chromium/firefox etc.) is not in [caps] → handled by [dgpu-active].
[caps]
# discord = floor=0a, max=0e, busy-up=50
# chrome-discord.com__channels_@me-Default = floor=0a, max=0e, busy-up=50
# v5.7: mpv — floor 0a (no declock to 07 during playback), busy-up 50.
# (the floor works under the profile policy; with [dgpu-active], max-pstate is ignored)
mpv = floor=0a, max=0e, busy-up=50

# v4.1: "low-power" window classes (terminals). Focusing a window from this list → forces
# the default profile (cap=07) with priority over preferred — even if Discord/
# YouTube generates load in the background, the focused terminal holds 07 (savings).
[low-power]
foot
footclient
Alacritty
alacritty
kitty
Kitty
ghostty
Ghostty
wezterm
org.wezcel.Weasel

[profile default]
# Non-preferred app (terminal, editor): cap 07, hard throttle.
# Thermal PER-PROFILE — conservative: above 77°C it slows down, recovery below 52°C.
max-pstate = 07
temp-down = 77
temp-up = 52

[profile preferred]
# Preferred app (browsers): a safe 07↔0a↔0e ladder (cap 0e).
# v4.1: 0f DISABLED (boost-pstate = -1) — 0e and 0a are both stable, 0f has no visible
# performance gain over 0e. When hot → ladder DOWN 0e→0a (THERMAL, one step).
# Preferred thermal: above 85°C it slows down (ladder), recovery below 65°C.
max-pstate = 0e
temp-down = 85
temp-up = 65
boost-pstate = -1
busy-boost = 85
boost-dwell-ms = 5000

# General parameters (override the built-in defaults). Load hysteresis 80/60 (20 pp).
[global]
interval-ms = 200
poll-ms = 1000
busy-up = 80
busy-down = 60
temp-dwell-ms = 5000
idle-dwell-ms = 1000
profile-dwell-ms = 2000
win-ms = 1000
exit-state = 0a
# v4.1: threshold for the instantaneous busy (‰) below which DOWN transitions are allowed
# (GR-idle gate). 500 = 50%. In-flight memory reclock under a GR render wedges the
# engine — the gate defers DOWN until busy dips. UP-LOAD/BOOST-UP are not gated.
gr-idle-promille = 500

# v5.6: [dgpu-active] — a THREE-STEP pstate policy for the WHOLE dGPU while ON.
# (report 79 + user decisions 2026-08-28). Replaces the profile-based state choice:
#   0a (baseline) — "efficient power save" — the default state of a working dGPU
#   07 (deep idle) — dGPU ON, nothing renders, no input for a dwell
#   0e (heavy)     — EXCLUSIVELY busy-driven: busy > busy-enter (80%) sustained
#                    AND temp < temp-up (thermal margin). A video title does NOT give 0e.
# User activity detection: evdev (/dev/input/event*, a separate thread — scroll+
# keyboard+mouse). Without evdev (activity-source != evdev or no devices):
# no input signal — idle after a dwell, wake only via busy/title change.
# enable = false → the daemon works as before (profile/ladder, old logic).
[dgpu-active]
enable = true
baseline = 0a
max = 0e
# ceiling when focused ∈ [low-power] (terminal): the background does not get 0e, but
# the 0a baseline stays (savings while keeping responsiveness).
low-power-ceiling = 0a
activity-source = evdev
# No input for X and busy < deep-idle-busy → the floor drops to 07 (deep idle).
activity-dwell-ms = 8000
# Busy % below which the dGPU may enter deep idle (07). YouTube ~25-36% busy
# → holds 0a; 480p (busy < 20%) → may drop to 07.
deep-idle-busy = 20
# 0e entry/exit for general load (the only path to 0e). busy-enter
# overrides the global busy-up (80) in the dGPU-active context.
busy-enter = 80
busy-exit = 40
# Thermal: true = per-profile (def 77/52, preferred 85/65 by focus); false =
# the shared temp-down/temp-up below. Entering 0e requires temp < temp-up.
temp-per-profile = true
# temp-down = 85
# temp-up = 65

# v4.2: applesmc fan control (the MacBook SMC). temp→RPM curve:
# v5.9: two-segment interpolation: temp-min → temp-mid (fan-mid% of the RPM range)
# → temp-max (steeply to 100%). temp-mid=0 → legacy linear (1:1) as before.
# The RPM ranges (fanN_min/max) are read dynamically from sysfs at startup — NOT
# hardcoded (fan1≈2160-6156, fan2≈2000-5700 RPM on the GT 750M). Updated every
# poll-ms (1 s). temp ≤ temp-min → min RPM (quiet), temp ≥ temp-max → max RPM.
# fan-override (/run/reclocked/fan-override, reclockctl fan-off) freezes auto.
# restore_auto on exit → fanN_manual=0 (SMC takes over, fail-safe).
# v5.1: temp-min-igd/temp-max-igd — a separate curve when ONLY the iGPU is on
# (dGPU OFF; temp = CPU/coretemp, because the nouveau hwmon disappears). When the dGPU is ON →
# the temp-min/temp-mid/temp-max curve (55-80-90, 3-point); both curves go to
# max at 90°C. Quieter: fans start at 55°C (dga) / 33°C (igd).
# Selected per sw.dgpu_off().
[fan]
enable = true
temp-min = 55
# v5.9: inflection point at 80°C at 60% of the RPM range (dga); above → steeply to
# full speed at 90°C. temp-mid=0 → legacy linear.
temp-mid = 80
fan-mid = 60
temp-max = 90
temp-min-igd = 33
# v5.9: igd curve — inflection at 80°C at 70% of the RPM range.
temp-mid-igd = 80
fan-mid-igd = 70
temp-max-igd = 90

# v5.10/v5.12: CASE THERMALS (reports 97, 98) — fans driven by the AVERAGE case
# temperature, not only max(CPU, dGPU).
#   Measure   — applesmc by labels (tempN_label → SMC key); the arithmetic
#               mean of the `keys` values (m°C; negative values skipped —
#               unconnected -127000, idle dummy TCTD). The keyboard has NO
#               sensor of its own — the TC0E/TC0F proxy (board frame under the keyboard)
#               is OUTSIDE the set (a CPU-curve duplicate, report 97 §2.3).
#   Curve     — linear: case ≤ case-min → 0% (min RPM, nothing forces),
#               case ≥ case-max → 100% RPM (fan max from [fan]); max() with the CPU
#               curve (CPU at 90°C gets max RPM regardless of case).
#               v5.12: case-min = 20 (user decision) — the physical case minimum
#               (~40°C under load) lies INSIDE the range → the curve is strong in the
#               working zone (44°C → 60% at case-max 60), the case is actively
#               cooled down to the physical minimum.
#   SOAK/HOLD — PULSE: case > soak-enter (45°C — above the typical working zone
#               40-44°C) for case-dwell-ms → SOAK for hold-ms with floor =
#               max(curve at entry, curve(current case)) — the floor
#               ESCALATES with the current case (v5.11, user decision).
#               PURELY TIMED EXIT (v5.12): after hold-ms unconditionally NORMAL —
#               the temperature exit (case < case-min−margin) was physically
#               unreachable (17/27/37°C) → SOAK hung forever. Re-entry when
#               case is again > soak-enter (hot → another pulse; cooled →
#               normal state). No permanent SOAK.
#   RAMP      — max RPM change per 1 s (ramp-rpm-s); the compiler boost and
#               fan-override are paramount and skip the ramp (safety).
#   enable=0  — the old 1:1 fan algorithm (escape hatch).
#   v5.12: exit-dwell-ms/margin OBSOLETE (timed exit) — parsed for back-compat,
#   can be removed from the config.
[fan-case]
enable = true
keys = Ta0P, TaSP, Th1H, Th2H, Ts0S, Ts1S, TM0P, TP0P
case-min = 35
case-max = 60
soak-enter = 45
case-dwell-ms = 5000
hold-ms = 300000
hold-floor = curve
ramp-rpm-s = 150

# v4.6: fan boost when a running compiler is detected. Scans /proc/*/comm
# (cmdline fallback) every poll-ms (1 s) for: clang, clang++, gcc, g++, cc, c++,
# cc1, cc1plus, make, cmake, ninja, cargo, rustc, meson, go, javac, ld, as,
# sccache, ccache + version prefixes (gcc-*, g++-*, clang-*).
#   enable   — 1/0 (default 1): enables the whole thing
#   fan-max  — % of the max RPM (default 100 = full fans; 50 = half the range)
#   names    — extra process names to detect (comma-separated; optional)
# The boost works ONLY in auto-mode — fan-override (/run/reclocked/fan-override,
# reclockctl fan-off) has priority (manual control is not overwritten).
# When the compiler disappears → return to the temp curve (normal path).
# v5.8: test processes (cmake -P LaunchTest.cmake/CTest, ctest, make test) do NOT count as a compiler — boost only during a real compilation.
[compiler]
enable = true
fan-max = 100
# names = mycc, mybuild

# v5.0: switchd module — dGPU power-state + render routing.
# In the DIS topology (the dGPU drives the panel) the module runs in MONITOR mode — zero
# power changes (dGPU power-off is blocked by the scanout gate). The power executor activates
# after G1 (boot-time switch to IGD via gpu-power-prefs + reboot).
#   enable            — 1/0 (default 1): module active
#   tick-ms           — decision tick (default 1000, == poll-ms)
#   dwell-in-ms       — entry dwell of a soft promotion (busy-gated)
#   dwell-out-ms      — exit dwell demote
#   min-residence-ms  — min time on the dGPU after a promotion (anti-flapping)
#   cooldown-ms       — cooldown after a demote before a new promotion
#   wait-ready-ms     — wait_off timeout after a power-off
#   min-switch-gap-ms — min interval between power-toggles
#   poweron-rate-limit-ms — v5.14 (report 114): min interval between AUTO power-ons
#                       (default 600000 = 10 min; 0 = off). Blocks the pulsing
#                       of title re-promotion (Discord/YT re-promote every
#                       title-idle-hold); an override (dgpu-on) bypasses it.
#   poweron-boot-guard-ms — v5.14: no AUTO power-on for N ms from the daemon
#                       start (default 120000 = 2 min; 0 = off). The
#                       reclocked-resume hook restarts the daemon on post-resume —
#                       the gate covers the resume window (pulsing right after S3 =
#                       nouveau oops → poisoned vgasr_mutex, report 114).
#   poweron-dead-gate — v5.15 (report 116): the "dGPU dead" gate. After a FAILED
#                       power-on (vgaswitcheroo write rejected or recovery
#                       failed) the daemon sets a persistent dead state — the
#                       /run/reclocked/dgpu-dead file (ts + reason) + the dgpu_dead*
#                       fields in the status. From then on AUTOMATIC promotions
#                       (title-promo ~30 s, cpu-temp-promote, soft/hard) NEVER
#                       request a power-on (one-off log + a counter of
#                       rejected ones every ~1 min). It expires ONLY through an
#                       explicit `reclockctl dgpu-on` (clears dead, one attempt) or
#                       a reboot (/run = tmpfs). Default true (do NOT disable —
#                       a retry-storm on a dead card killed the daemon at boot -2).
#   temp-gate         — °C: do not promote when the dGPU is hotter
#   busy-enter        — % busy for a soft promotion
#   busy-exit         — % busy for a demote
#   pstate-settle-ms  — do not write pstate after a power-on (GPU clock settle after D3hot→D0;
#                       the first clock change can hang the nouveau workqueue)
#   pstate-write-timeout-ms — pstate write timeout (kernel hang safety: the write happens in
#                       a separate thread, after the timeout the daemon stays alive and pauses pstate)
#   title-idle-busy   — % busy: a Discord/YT tab (title promotion) with busy below
#                       the threshold is 'idle' → demote to the iGPU (power-off) after dwell-out
# v5.6: browsers are NO longer in [dgpu-hard] — Discord/YouTube tabs promote by
# title ([preferred-titles]); the remaining tabs are neutral (iGPU). A title promotion
# is not a latch (busy < title-idle-busy → demote). Timers shortened to 1 s.
[switch]
enable = true
tick-ms = 1000
dwell-in-ms = 3000
dwell-out-ms = 1000
min-residence-ms = 1000
cooldown-ms = 1000
wait-ready-ms = 2000
min-switch-gap-ms = 1000
temp-gate = 82
busy-enter = 80
busy-exit = 40
# v5.6: > 70% busy = hold the dGPU state for video; below → declock to 07 / iGPU.
# Easy change + reload (SIGHUP).
title-idle-busy = 70
# v5.6: after demoting a Discord/YouTube tab, hold the dGPU OFF for this long before
# a new promotion — prevents churn (playing YT on the iGPU does not re-promote every 3-4 s).
# v5.7: title re-promotion only after a title/focus change — YT with busy < the threshold
# stays on the iGPU for the whole video (zero churn); a new video → re-promotion.
title-idle-hold-ms = 30000
# v5.6: busy % below which a [dgpu-idle] class (e.g. mpv) is 'idle' → demote
# to the iGPU (power-off) after dwell-out. Easy change + reload (SIGHUP).
# v5.7: + cpu-temp-gate — CPU hot (doing something else) + dGPU with thermal headroom
# → hold the dGPU despite busy < the threshold; a pause (busy < 5%) → always demote.
class-idle-busy = 33
# v5.7: CPU temp threshold (°C) for demoting a [dgpu-idle] class (mpv). CPU hotter than
# the threshold (doing something else) + dGPU below temp-gate (has thermal headroom) → mpv
# stays on the dGPU. busy < 5% (pause) → always demote. 0 = disabled.
cpu-temp-gate = 70
# v5.9: thermal CPU offload — a title tab (YT/Discord): CPU ≥ threshold →
# re-promote to the dGPU without a title/focus change + demote blocked (dGPU <
# temp-gate, busy ≥ 5%) — the dGPU takes over the render, the CPU cools. 0 = disabled.
# Guard: busy after a power-on is unreliable for pstate-settle-ms — the busy<5%
# escape only after that time (no churn with CPU ≥ threshold).
cpu-temp-promote = 70
# v5.13 (D1): activity-aware power-off gate. An open dGPU render fd does NOT
# block a power-off when busy=0 for busy-idle-dwell-ms — chromium holds a
# passive probe fd on renderD129 PERMANENTLY (busy=0, empty fdinfo, report 99).
# busy > 1% in the dwell window → defer (active render). The window is measured from the
# last busy>0 sample, reset on power-on. 0 = disabled (gate only on the fd itself).
busy-idle-dwell-ms = 3000
# v5.15: the "dGPU dead" gate after a failed power-on (report 116) — see the key
# description above. true = automatic promotions no longer attempt a power-on on a card
# that did not wake; unlocked only by reclockctl dgpu-on or a reboot.
poweron-dead-gate = true
pstate-settle-ms = 2000
pstate-write-timeout-ms = 2000

# dGPU power backend.
#   backend               — manual (echo ON/OFF to vgaswitcheroo) | runpm (power/control)
#   autosuspend-ms        — autosuspend_delay_ms for runpm
#   wait-idle-timeout-ms  — /proc fd scan before a power-off (open /dev/dri)
#   wait-ready-timeout-ms — nouveau reinit timeout after a power-on (runtime_status=active)
[dpower]
backend = manual
autosuspend-ms = 5000
wait-idle-timeout-ms = 5000
wait-ready-timeout-ms = 10000

# Window classes requiring the dGPU (hard promotion, no busy-gate)
# v5.6: browsers REMOVED — Discord/YouTube tabs promote by title
# ([preferred-titles]), the rest of the tabs are neutral (iGPU). Hard promotion
# only for heavy apps. A title promotion is not a latch:
# busy < title-idle-busy → demote to the iGPU.
[dgpu-hard]
game
blender
steam

# Window classes with a soft promotion (busy-gated) — empty at the start
[dgpu-soft]

# Window classes with an idle-demote: promote to the dGPU like hard ones, but busy < class-idle-busy
# → demote to the iGPU (e.g. mpv — video on the dGPU, pause/idle on the iGPU)
[dgpu-idle]
mpv

# Window classes always on the iGPU (demotion)
[igpu]
foot
kitty
alacritty

# Processes requiring the dGPU (/proc/*/comm scan) — CUDA, DRI_PRIME
[dgpu-procs]
cuda
blender